##
## Vibrant relay: a stock strfry, configured for the Vibrant frontier use case.
## Open writes (anyone can share in one step), gated only by the write-policy plugin
## (kind + size + proof-of-work). Merge these keys over strfry's shipped default config.
##
db = "/app/strfry-db"

relay {
    bind = "0.0.0.0"
    port = 7777
    nofiles = 0

    info {
        name = "Vibrant relay"
        description = "The Vibrant frontier: open writes, proof-of-work gated, Vibrant events only. github.com/3dl-dev/vibrant"
        pubkey = ""
        contact = ""
    }

    # Reports (kind 30079) are the largest Vibrant event (~82KB packed); cap a little above.
    maxWebsocketPayloadSize = 262144

    # Read-side caps (the frontier a view folds is tiny; keep scans bounded).
    maxReqFilterSize = 200
    maxFilterLimit = 500
    maxSubsPerConnection = 40

    writePolicy {
        # Every incoming EVENT is gated by the Vibrant policy: Vibrant kinds only, size caps,
        # and a NIP-13 proof-of-work floor. Writes are OPEN (no author allowlist); the PoW is
        # the anti-flood gate, a few seconds of the sharer's CPU, invisible in a skill flow.
        plugin = "/app/vibrant_policy.py"
    }

    compression = true
    logging {
        dumpInAll = false
        dumpInEvents = false
    }
}
